<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <h1>Rock Paper Scissors</h1>

        <div class="scoreboard">
            <div class="score-box">
                <p>Player</p>
                <span id="player-score">0</span>
            </div>
            <div class="score-box">
                <p>Computer</p>
                <span id="computer-score">0</span>
            </div>
        </div>

        <div class="status" id="status">Choose your weapon to start!</div>


        <!-- Added Section: Displays Computer Choice -->
        <div class="computer-display">
            <p>Computer Picked:</p>
            <div class="choice-btn display-only" id="computer-choice">❓</div>
        </div>

        <div class="choices">
            <button class="choice-btn" id="rock">🪨</button>
            <button class="choice-btn" id="paper">📄</button>
            <button class="choice-btn" id="scissors">✂️</button>
        </div>

        <button class="reset-btn" id="reset">Reset Game</button>
    </div>
